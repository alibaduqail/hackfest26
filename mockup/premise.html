<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premise intro mockup</title>
<!-- MOCKUP ONLY. Not wired into the app. States: ?s=a (mid-typing, line 2), ?s=b (full log), ?s=c (log receding, ECHO fading in), ?s=d (alternative placement, full log). No ?s = live autoplay. -->
<style>
@font-face { font-family: "Fraunces"; font-weight: 800; src: url("../hollow-world/public/fonts/Fraunces-800.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../hollow-world/public/fonts/IBMPlexMono-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../hollow-world/public/fonts/IBMPlexMono-600.woff2") format("woff2"); }
:root { --bg:#0d1216; --text:#ddd8c1; --head:#e9e0c8; --text2:#b4c4ba; --muted:#90a59f; --dim:#6f857f; --amber:#d2a76a; --amberHi:#e4c494; --amberText:#edcd95; --good:#7ec8b3; --ease:cubic-bezier(.23,1,.32,1); }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; }

/* The stage is the art's own coordinate space (1672x941, "cover"), so the log stays pinned to the dark void and the clinic at any viewport. */
.stage { position:absolute; left:50%; top:50%; width:max(100vw, calc(100vh * 1672 / 941)); aspect-ratio:1672/941; transform:translate(-50%,-50%); container-type:size; }
.art { position:absolute; inset:0; background:url("../hollow-world/src/echo-view/cutaway/art/descent.webp") center/100% 100% no-repeat; image-rendering:pixelated; }
/* the shade: the title's radial dimmer, but only over the centre. During the log the room is left lit around the void and the clinic. */
.shade { position:absolute; inset:0; background:radial-gradient(ellipse 55% 45% at 50% 46%, rgba(13,18,22,.55), rgba(13,18,22,.82) 70%, rgba(13,18,22,.94)); opacity:var(--shade,.3); transition:opacity 1.6s var(--ease); }
.dusk { position:absolute; inset:0; background:rgba(8,12,15,.52); opacity:var(--dusk,.18); transition:opacity 1.6s var(--ease); }

/* ---- the log: set into the blacked-out level, on its floor ---- */
.log { position:absolute; left:8.2%; top:45.6%; width:34%; font-size:1cqw; line-height:1.62; color:var(--text2); font-weight:500; transition:opacity 1.8s ease-in-out, transform 1.8s ease-in-out, filter 1.8s ease-in-out; }
.log-head { display:flex; align-items:center; gap:1.1em; color:var(--dim); font-size:.86em; line-height:1; padding-bottom:.9em; margin-bottom:.35em; border-bottom:1px solid rgba(126,200,179,.22); }
.log-head b { color:var(--good); font-weight:500; }
.sig { display:inline-flex; gap:.45em; margin-left:auto; }
.sig i { width:.62em; height:.62em; border-radius:50%; border:1.5px solid var(--dim); background:transparent; transition:background .3s, border-color .3s; }
.sig i.on { background:var(--good); border-color:var(--good); }
.ln { visibility:hidden; display:grid; grid-template-columns:3.7em 1fr; white-space:nowrap; min-height:1.62em; }
.ln time { color:var(--dim); font-size:.9em; }
.ln span { color:var(--head); }
.ln.call span::first-line { color:var(--head); }
.ln .who { color:var(--amberText); }
.caret { display:inline-block; width:.55em; height:1.05em; margin-left:.12em; vertical-align:-.17em; background:var(--amber); animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
/* static: a line arrives with a short horizontal tear, then settles */
.ln.hit span { animation:tear .22s steps(2) 1; }
@keyframes tear { 0%{ transform:translateX(5px); opacity:.5; } 40%{ transform:translateX(-4px); opacity:.85; } 70%{ transform:translateX(2px); } 100%{ transform:none; opacity:1; } }
.scan { position:absolute; left:0; right:0; top:0; height:1px; background:rgba(126,200,179,.35); opacity:0; pointer-events:none; }
.log.live .scan { animation:scan 4.4s linear infinite; }
@keyframes scan { 0%{ top:0; opacity:0; } 8%{ opacity:.7; } 92%{ opacity:.7; } 100%{ top:100%; opacity:0; } }

/* ---- Mara: a beacon in the clinic, and the hop line that carries her voice up to the log ---- */
.hop { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.hop path { fill:none; stroke:var(--good); stroke-width:2; stroke-dasharray:4 7; opacity:.95; vector-effect:non-scaling-stroke; }
.mara { position:absolute; left:76.2%; top:90.6%; width:0; height:0; transition:opacity 1.2s var(--ease); }
.mara .dot { position:absolute; left:-.62cqw; top:-.62cqw; width:1.24cqw; height:1.24cqw; border-radius:50%; background:var(--amber); border:2px solid var(--amberHi); box-shadow:0 0 12px rgba(210,167,106,.55); }
.mara .ping { position:absolute; left:-.62cqw; top:-.62cqw; width:1.24cqw; height:1.24cqw; border-radius:50%; border:1.5px solid var(--amberHi); animation:ping 3.2s var(--ease) infinite; }
@keyframes ping { 0%{ transform:scale(1); opacity:.9; } 100%{ transform:scale(3.4); opacity:0; } }
.mara em { position:absolute; left:1.7cqw; top:-.75cqw; font-style:normal; font-size:.86cqw; color:var(--amberText); white-space:nowrap; letter-spacing:.04em; }
.mara em small { display:block; font-size:.9em; color:var(--text2); opacity:.8; }

/* ---- the title: unchanged from the game (Fraunces ECHO, Relay nodes) ---- */
.title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity 1.2s var(--ease); }
.title .bar { opacity:0; transition:opacity 1.2s var(--ease) .7s; }
.stage[data-s="recede"] .title .bar, .stage[data-s="done"] .title .bar { opacity:1; }
.title::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse 50% 46% at center, rgba(10,16,19,.7), rgba(10,16,19,.35) 55%, transparent 100%); pointer-events:none; }
.title h1 { position:relative; margin:0; font:800 min(15vw, 24.5cqh*1.0)/.92 "Fraunces", Georgia, serif; font-size:clamp(96px, 15vw, 220px); font-variation-settings:"opsz" 144; letter-spacing:.07em; margin-right:-.07em; color:var(--head); text-shadow:0 0 60px rgba(126,200,179,.22), 0 2px 24px rgba(6,11,14,.8); }
.bar { position:relative; display:flex; justify-content:center; gap:clamp(8px,3vw,56px); margin-top:clamp(40px,7vh,72px); }
.more { margin-top:clamp(8px,2vh,20px); gap:clamp(0px,2vw,32px); }
.node { display:flex; flex-direction:column; align-items:center; gap:14px; padding:12px 30px; min-height:44px; background:none; border:0; color:var(--text); font:600 19px/1.15 "IBM Plex Mono", monospace; letter-spacing:.16em; cursor:pointer; }
.node .d { width:16px; height:16px; border-radius:50%; border:2px solid var(--text2); background:#0a1013; }
.node.primary .d { background:var(--amber); border-color:var(--amberHi); box-shadow:0 0 12px rgba(210,167,106,.55); }
.node.primary .l { color:var(--head); }
.node.quiet { font-size:15px; font-weight:500; letter-spacing:.08em; color:var(--text2); gap:9px; padding:8px 18px; }
.node.quiet .d { width:9px; height:9px; margin:1.5px 0; border-color:var(--text2); }

/* ---- Skip: a quiet Relay node, bottom-left under the log ---- */
.skip { position:absolute; left:6.4%; bottom:5.2%; flex-direction:row; gap:10px; font-size:14px; letter-spacing:.08em; font-weight:500; color:var(--muted); padding:8px 14px; transition:opacity .8s var(--ease); }
.skip .d { width:9px; height:9px; border-color:var(--muted); }
.skip kbd { font:inherit; color:var(--dim); margin-left:.4em; }
.skip:hover { color:var(--amberText); } .skip:hover .d { border-color:var(--amberHi); }

/* ---- state switches (JS sets data-s on .stage: type | read | recede | done) ---- */
.stage .title { opacity:0; pointer-events:none; }
.stage .skip { opacity:1; }
.stage[data-s="recede"] .log, .stage[data-s="done"] .log { opacity:0; transform:translateY(-10px); filter:blur(1.5px); }
.stage[data-s="recede"] .title, .stage[data-s="done"] .title { opacity:1; pointer-events:auto; }
.stage[data-s="recede"] .skip, .stage[data-s="done"] .skip { opacity:0; pointer-events:none; }
.stage[data-s="recede"] .mara, .stage[data-s="done"] .mara, .stage[data-s="recede"] .hop, .stage[data-s="done"] .hop { opacity:0; transition:opacity 1.4s var(--ease); }
.stage[data-s="recede"], .stage[data-s="done"] { --dusk:0; --shade:1; }

/* ---- alternative placement (d): lower-left void, level 4, one floor above Mara's clinic ---- */
.stage.alt .log { top:5.4%; left:56.4%; width:34%; font-size:.96cqw; }
.stage.alt .hop-main { display:none; } .stage:not(.alt) .hop-alt { display:none; }


@media (prefers-reduced-motion: reduce) { .caret, .scan, .mara .ping { animation:none !important; } .ln.hit span { animation:none !important; } .stage .title, .log, .mara, .hop { transition-duration:.01s !important; } }
</style>
</head>
<body>
<div class="stage" id="stage" data-s="type">
  <div class="art"></div>
  <div class="dusk"></div>
  <div class="shade"></div>

  <svg class="hop" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
    <path class="hop-main" id="hopMain" d="M1275 880 V566 H742"/>
    <path class="hop-alt" id="hopAlt" d="M1275 880 V742 H1535 V212"/>
  </svg>
  <div class="mara" id="mara" aria-hidden="true"><span class="ping"></span><span class="dot"></span><em>Mara</em></div>

  <section class="log live" id="log" aria-label="Radio log from Mara, Deep Clinic">
    <div class="scan"></div>
    <div class="log-head"><span><b>Deep Clinic</b>, level 5</span><span>to any relay</span><span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <div id="lines"></div>
  </section>

  <div class="title" id="title">
    <h1 aria-label="Echo"><span aria-hidden="true">ECHO</span></h1>
    <div class="bar"><button class="node primary"><span class="d"></span><span class="l">Begin</span></button></div>
    <div class="bar more"><button class="node quiet"><span class="d"></span>Tower Down</button><button class="node quiet"><span class="d"></span>Strata city</button><button class="node quiet"><span class="d"></span>Descent</button></div>
  </div>

  <button class="node quiet skip" id="skip"><span class="d"></span>Skip<kbd>any key</kbd></button>
</div>

<script>
const LINES = [
  ["02:14", "Mara, nurse, Deep Clinic. Anyone on the relay?"],
  ["02:14", "Tower says all clear. It isn't. People can't breathe."],
  ["02:15", "The medicine is five levels up. It has to come down."],
  ["02:16", "You're the relay now. Light the beacons down to us."],
];
// signal strength per line: the tower's lie knocks one bar out
const SIG = [3, 2, 3, 4];
const q = new URLSearchParams(location.search), forced = q.get("s");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage"), box = document.getElementById("lines"), bars = [...document.querySelectorAll(".sig i")];
if (forced === "d" || q.get("alt")) stage.classList.add("alt");
const rows = LINES.map(([t, s]) => { const r = document.createElement("div"); r.className = "ln"; r.innerHTML = `<time>${t}</time><span></span>`; box.appendChild(r); return r; });
const setSig = n => bars.forEach((b, i) => b.classList.toggle("on", i < n));
const set = s => stage.dataset.s = s;
const show = (i, n) => { rows[i].style.visibility = "visible"; rows[i].querySelector("span").textContent = LINES[i][1].slice(0, n); };
let timers = [], done = false;
const later = (f, ms) => timers.push(setTimeout(f, ms));
const caretTo = i => { document.querySelector(".caret")?.remove(); const c = document.createElement("i"); c.className = "caret"; rows[i].querySelector("span").appendChild(c); };

function finish() { if (done) return; done = true; timers.forEach(clearTimeout); document.querySelector(".caret")?.remove(); rows.forEach((_, i) => show(i, 99)); setSig(4); set("recede"); later(() => set("done"), 1700); }

function play() {
  if (reduced) { rows.forEach((_, i) => show(i, 99)); setSig(4); set("read"); later(finish, 6000); return; }
  let t = 600;
  LINES.forEach(([, s], i) => {
    later(() => { setSig(SIG[i]); rows[i].style.visibility = "visible"; rows[i].classList.add("hit"); caretTo(i); }, t);
    for (let c = 1; c <= s.length; c++) later(() => { show(i, c); caretTo(i); }, t + 120 + c * 24);
    t += 120 + s.length * 24 + 520;
  });
  later(() => set("read"), t);
  later(finish, t + 1500);          // hold, then the log recedes and ECHO + buttons arrive
}
// any key / click / skip node ends the log at once. The click is only the node, so the backdrop is not a skip target.
addEventListener("keydown", e => { if (!e.metaKey && !e.ctrlKey && !e.altKey && stage.dataset.s !== "done") finish(); });
document.getElementById("skip").addEventListener("click", finish);

if (forced === "a") { show(0, 99); show(1, 27); setSig(2); caretTo(1); rows[1].classList.add("hit"); rows[1].querySelector("span").style.animation = "none"; set("type"); }
else if (forced === "b" || forced === "d") { rows.forEach((_, i) => show(i, 99)); setSig(4); set("read"); caretTo(3); }
else if (forced === "c") { rows.forEach((_, i) => show(i, 99)); setSig(4); set("read"); setTimeout(() => set("recede"), 60); }
else play();
</script>
</body>
</html>
